<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — quizEL</title>
  <link rel="stylesheet" href="shared.css"/>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand">
    <div class="nav-logo" aria-label="quizEL logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8"/>
        <path d="M14.5 14.5l3 3"/>
      </svg>
    </div>
    <span>quizEL</span>
  </a>
  <div class="nav-right">
    <a href="index.html" class="nav-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Home
    </a>
    <button class="dark-toggle" id="btn-dark" title="Toggle dark mode">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</nav>

<script src="auth.js"></script>

<div class="page">
  <div class="page-header" style="max-width:520px; margin:0 auto 2rem; text-align:center;">
    <div class="page-tag">Account Setup</div>
    <h1 class="page-title" id="form-title">Create an account</h1>
    <p class="page-subtitle" id="form-subtitle">Choose a username and password to access quizEL securely.</p>
  </div>

  <div class="login-box">
    <form class="login-form" id="auth-form">
      <div>
        <label class="field-label" for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required />
      </div>
      <div>
        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Choose a password" required />
      </div>
      <div class="login-actions">
        <button class="btn btn-dark btn-pill" type="submit" id="action-button">Create account</button>
        <button class="btn white-pill btn-pill" type="button" id="switch-button">Already have an account?</button>
      </div>
      <p id="login-status" class="form-note">Your account is saved locally in the browser.</p>
    </form>
  </div>
</div>

<script>
  const authForm = document.getElementById('auth-form');
  const actionButton = document.getElementById('action-button');
  const switchButton = document.getElementById('switch-button');
  const formTitle = document.getElementById('form-title');
  const formSubtitle = document.getElementById('form-subtitle');
  const loginStatus = document.getElementById('login-status');

  let mode = getStoredAccount() ? 'login' : 'create';

  function updateFormMode() {
    const hasAccount = Boolean(getStoredAccount());
    if (mode === 'login') {
      formTitle.textContent = 'Log in to quizEL';
      formSubtitle.textContent = 'Enter your existing username and password.';
      actionButton.textContent = 'Log in';
      switchButton.textContent = hasAccount ? 'Create a new account' : 'Create account';
    } else {
      formTitle.textContent = 'Create an account';
      formSubtitle.textContent = 'Choose a username and password to access quizEL securely.';
      actionButton.textContent = 'Create account';
      switchButton.textContent = 'Already have an account?';
    }
    loginStatus.textContent = hasAccount
      ? 'You can create a second account only after logging out.'
      : 'Your account is saved locally in the browser.';
  }

  authForm.addEventListener('submit', event => {
    event.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    try {
      if (mode === 'create') {
        createAccount(username, password);
        loginStatus.textContent = 'Account created successfully. You can now log in.';
        mode = 'login';
        updateFormMode();
      } else {
        if (!verifyAccount(username, password)) {
          throw new Error('Username or password is incorrect.');
        }
        signIn(username);
        window.location.replace('index.html');
      }
    } catch (error) {
      loginStatus.textContent = error.message;
    }
  });

  switchButton.addEventListener('click', () => {
    mode = mode === 'login' ? 'create' : 'login';
    updateFormMode();
  });

  updateFormMode();

  const btnDark = document.getElementById('btn-dark');
  btnDark?.addEventListener('click', () => {
    document.body.classList.toggle('dark');
  });
</script>

</body>
</html>
